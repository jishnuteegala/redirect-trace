name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@129e56114c4903f7d17dccaaaad6d5a1d300aed1
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'

  baseline:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@v1
    with:
      os: '["windows-latest"]'
