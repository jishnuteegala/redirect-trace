name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@4bcb67e1dab1aa2e52d325b2b18b568fd9d2bbcd
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
