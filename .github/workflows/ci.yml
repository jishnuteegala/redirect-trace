name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@50e7c2dbdb7f1430986ef67760fc9c790c9e4e31
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
